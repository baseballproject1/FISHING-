<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎣 낚시왕 Pixel</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game-container">


<!-- 게임 제목 -->

<header class="pixel-header">

<h1>🎣 낚시왕</h1>

</header>





<!-- 저장 슬롯 -->

<section class="save-panel">


<h3>💾 저장</h3>


<div class="save-buttons">


<button onclick="saveSlot(1)">
저장 1
</button>


<button onclick="loadSlot(1)">
불러오기 1
</button>


<button onclick="deleteSlot(1)">
삭제 1
</button>



<button onclick="saveSlot(2)">
저장 2
</button>


<button onclick="loadSlot(2)">
불러오기 2
</button>


<button onclick="deleteSlot(2)">
삭제 2
</button>



<button onclick="saveSlot(3)">
저장 3
</button>


<button onclick="loadSlot(3)">
불러오기 3
</button>


<button onclick="deleteSlot(3)">
삭제 3
</button>


</div>


</section>





<!-- 상태창 -->

<section class="status-panel">


<div class="status-box">

💰 골드

<br>

<span id="gold">
10000
</span>

G

</div>



<div class="status-box">

⭐ 레벨

<br>

Lv.

<span id="level">
1
</span>

</div>



<div class="status-box">

🌍 지역

<br>

<span id="area">
초보 낚시터
</span>

</div>



<div class="status-box">

🐟 도감

<br>

<span id="book">
0
</span>

/120

</div>


</section>






<!-- 픽셀 월드 -->

<section class="pixel-world">


<img 

id="background"

class="background"

src="assets/lake.png">



<img

id="player"

class="player"

src="assets/player.png">



<img

id="boat"

class="boat"

src="assets/boat.png">



<img

id="fishImage"

class="fish-image"

src="assets/fish.png">


</section>






<!-- 낚시 결과 -->

<section id="result"

class="result-box">


🎣 낚시를 시작하세요!


</section><!-- 메뉴 -->

<section class="menu-panel">


<h3>🎮 메뉴</h3>


<div class="menu-buttons">


<button onclick="fish()">
🎣 낚시하기
</button>



<button onclick="showArea()">
🌍 지역
</button>



<button onclick="showBoat()">
🚢 배
</button>



<button onclick="showAquarium()">
🐠 수족관
</button>



<button onclick="showInventory()">
🎒 보관함
</button>



<button onclick="showShop()">
🏪 상점
</button>



<button onclick="showMission()">
📜 미션
</button>



<button onclick="showAchievement()">
🏆 업적
</button>



<button onclick="showContest()">
🏅 낚시 대회
</button>



<button onclick="showRanking()">
📊 기록
</button>


</div>


</section>







<!-- 현재 장비 -->

<section class="equipment-panel">


<h3>🎣 장비</h3>


<div>

🚢 현재 배 :

<span id="boat">
배 없음
</span>

</div>



<div>

🎒 아이템 :

<span id="itemCount">
0
</span>

</div>


</section>








<!-- 픽셀 로그 -->

<section class="log-panel">


<h3>📜 낚시 기록</h3>


<div id="log">

아직 기록이 없습니다.

</div>


</section>








</div>







<!-- 시스템 파일 -->

<script src="js/fish.js"></script>

<script src="js/balance.js"></script>

<script src="js/effect.js"></script>



<script src="js/save.js"></script>



<script src="js/area.js"></script>

<script src="js/boat.js"></script>

<script src="js/inventory.js"></script>

<script src="js/aquarium.js"></script>

<script src="js/mission.js"></script>

<script src="js/achievement.js"></script>

<script src="js/contest.js"></script>

<script src="js/ranking.js"></script>

<script src="js/shop.js"></script>



<script src="js/game.js"></script>




</body>

</html>
